# Smithery MCP Server Configuration for ContextShield
# Eliminates Cursor 40-Tool Limit & Prunes Context Window Schema Bloat

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      mode:
        type: string
        title: "Routing Mode"
        description: "Dynamic routing mode (multiplexed | firewall | passthrough)"
        default: "multiplexed"
      tokenPruning:
        type: boolean
        title: "Token Pruning"
        description: "Enable AST schema token pruning to bypass tool caps"
        default: true
    required: []

exampleConfig:
  mode: "multiplexed"
  tokenPruning: true

metadata:
  name: "contextshield"
  title: "ContextShield Dynamic MCP Router & Security Firewall"
  description: "Zero-trust dynamic MCP router and AST security firewall that eliminates the Cursor 40-tool limit and reduces context bloat by 85%."
  homepage: "https://neoninnovationlab.com/solutions/cursor-40-tool-limit"
  repository: "https://github.com/Ansarii/neoninnovationlab"
  license: "MIT"
  tags:
    - mcp
    - cursor
    - claude
    - windsurf
    - token-optimization
    - security-firewall
